server:
  port: 8089

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remark_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user
        globally_quoted_identifiers: true
  liquibase:
    default-schema: '"user"'
    liquibase-schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  internal:
    secret: ${INTERNAL_SECRET:dev-secret-change-me}
  reference-service:
    base-url: ${APP_REFERENCE_SERVICE_URL:http://localhost:8084}
  notification-service:
    base-url: ${APP_NOTIFICATION_SERVICE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs
