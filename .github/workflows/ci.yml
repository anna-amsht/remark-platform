name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remark_platform
          POSTGRES_USER: remark
          POSTGRES_PASSWORD: remark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remark -d remark_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/remark_platform
          SPRING_DATASOURCE_USERNAME: remark
          SPRING_DATASOURCE_PASSWORD: remark
          INTERNAL_SECRET: ci-test-secret

  docker:
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - reference-service
          - user-service
          - auth-service
          - remark-service
          - notification-service
          - report-service
          - gateway

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg MODULE=${{ matrix.module }} -t remark-${{ matrix.module }} .
