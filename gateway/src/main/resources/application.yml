server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: ${APP_AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-jwks
          uri: ${APP_AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/.well-known/jwks.json
        - id: reference-service
          uri: ${APP_REFERENCE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/refs/**
        - id: user-service
          uri: ${APP_USER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/users/**
        - id: remark-service
          uri: ${APP_REMARK_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/remarks/**
        - id: report-service
          uri: ${APP_REPORT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/reports/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${APP_AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
