server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remark_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  liquibase:
    default-schema: auth
    liquibase-schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  internal:
    secret: ${INTERNAL_SECRET:dev-secret-change-me}
  user-service:
    base-url: ${APP_USER_SERVICE_URL:http://localhost:8089}
  jwt:
    issuer: remark-platform-auth
    key-id: auth-key-1
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    private-key-path: ${APP_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${APP_JWT_PUBLIC_KEY_PATH:}
  cookie:
    secure: ${COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
