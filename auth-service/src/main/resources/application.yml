server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/remark_platform
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  liquibase:
    default-schema: auth
    liquibase-schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  internal:
    secret: ${INTERNAL_SECRET:dev-secret-change-me}
  user-service:
    base-url: http://localhost:8089
  jwt:
    issuer: remark-platform-auth
    key-id: auth-key-1
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cookie:
    secure: false

springdoc:
  api-docs:
    path: /v3/api-docs
