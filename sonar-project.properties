sonar.host.url=https://sonarcloud.io

sonar.java.source=21
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/target/**,**/*Application.java
sonar.cpd.exclusions=**/Dockerfile
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Quality Gate проверяется внутри mvn sonar:sonar (без отдельного GitHub Action).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# sonar.organization и sonar.projectKey задаются в GitHub Actions (Repository variables).
# SONAR_TOKEN — только в GitHub Secrets, не коммитить.
