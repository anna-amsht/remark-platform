sonar.host.url=https://sonarcloud.io

sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Не анализировать инфраструктуру и сгенерированное
sonar.exclusions=\
  **/target/**,\
  **/*Application.java,\
  **/db/changelog/**,\
  **/Dockerfile

# Покрытие считаем только для бизнес-логики (service), не для boilerplate
sonar.coverage.exclusions=\
  **/gateway/**,\
  **/report-service/**,\
  **/remark-common-events/**,\
  **/config/**,\
  **/controller/**,\
  **/dto/**,\
  **/entity/**,\
  **/exceptions/**,\
  **/client/**,\
  **/kafka/**,\
  **/repository/**,\
  **/security/**,\
  **/ProcessedEventService.java,\
  **/*ApplicationEvent.java,\
  **/*Mapper.java

# Дубли: однотипные клиенты, фильтры, конфиги
sonar.cpd.exclusions=\
  **/Dockerfile,\
  **/InternalSecretFilter.java,\
  **/config/**,\
  **/controller/**,\
  **/client/**,\
  **/dto/**,\
  **/entity/**,\
  **/repository/**,\
  **/kafka/**,\
  **/application.yml

sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
