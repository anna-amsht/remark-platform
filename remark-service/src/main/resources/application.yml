server:
  port: 8083

spring:
  application:
    name: remark-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remark_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: remark
  liquibase:
    default-schema: remark
    liquibase-schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  internal:
    secret: ${INTERNAL_SECRET}
  user-service:
    base-url: ${APP_USER_SERVICE_URL:http://localhost:8089}

springdoc:
  api-docs:
    path: /v3/api-docs
